# Sveltia CMS configuration for Thinking About Policing.
# (Sveltia reads the same config format as Decap CMS, so swapping the editor
# back is a one-line change in index.html — nothing here is Sveltia-only
# except `media_libraries`, which Decap simply ignores.)
#
# Auth: "Sign in with GitHub" via Netlify's built-in OAuth provider. One-time
# setup (see README "Writing in the browser"):
#   1. Register a GitHub OAuth App with callback https://api.netlify.com/auth/done
#   2. Install that app under the Netlify site's authentication providers.
# No password to store, and no extra server to run.

backend:
  name: github
  repo: idorunning/thinkingaboutpolicing
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    openAuthoring: '{{message}}'

# Direct publishing: each Save commits straight to `main`, so the change goes
# live on the next build (a minute or two) — no separate "Publish"/merge step.
# To hold a piece back, switch on "Keep hidden on the live site" (the draft
# flag); to take a published piece down, delete it or switch that flag on.
# (Removed: publish_mode: editorial_workflow, which staged every change as a
# pull request that only went live once merged.)

# Local editing: run `npm run dev`, open http://localhost:4321/admin/ and pick
# "Work with Local Repository" (Chrome/Edge) — edits write straight to your
# working copy, no login and no proxy server needed. The key below is kept so
# a rollback to Decap (`npx decap-server` flow) still works.
local_backend: true

site_url: https://thinkingaboutpolicing.org
display_url: https://thinkingaboutpolicing.org
logo_url: https://thinkingaboutpolicing.org/favicon.svg

# Images chosen in the editor are committed here and referenced as /images/...,
# matching how the existing articles link their charts and photos.
media_folder: "public/images"
public_folder: "/images"

# Sveltia's asset handling: cap uploads at 10 MB and auto-convert big raster
# images to WebP (max 2048px) so phone photos don't land in the repo as 4 MB
# JPEGs. SVGs and small images pass through untouched. (Decap ignores this.)
media_libraries:
  default:
    config:
      max_file_size: 10485760
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    description: "Every article. The Section field decides which area it appears in — change it to move a piece between areas."
    folder: "src/content/articles"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "{{section}}/{{slug}}"
    # Show each article's card image in the editor's content list (Sveltia).
    thumbnail: "thumbnail"
    sortable_fields: ["pubDate", "title", "section"]
    # Group the board/list by section so each area is easy to find.
    view_groups:
      - { label: "Section", field: "section" }
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "section",
          label: "Section — change this to move the article between areas",
          widget: "select",
          default: "police-policy",
          options:
            [
              { label: "Police Policy", value: "police-policy" },
              { label: "Public Policy", value: "public-policy" },
              { label: "Influential People", value: "influential-people" },
              { label: "Interesting Distractions", value: "other" },
              { label: "The Data Tells a Story", value: "data-stories" },
            ],
        }
      - {
          name: "description",
          label: "Description — the standfirst, and the search/social summary",
          widget: "text",
        }
      - {
          name: "pubDate",
          label: "Publish date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          picker_utc: true,
        }
      - {
          name: "updatedDate",
          label: "Updated date (optional)",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          picker_utc: true,
          required: false,
        }
      - {
          name: "author",
          label: "Author",
          widget: "string",
          default: "Nathan Tracey",
          required: false,
        }
      - {
          name: "thumbnail",
          label: "Thumbnail / card image (optional)",
          widget: "image",
          required: false,
          choose_url: true,
        }
      - {
          name: "heroImage",
          label: "Hero image (optional)",
          widget: "image",
          required: false,
          choose_url: true,
        }
      - {
          name: "portrait",
          label: "Portrait (optional) — head-and-shoulders photo for Influential People cards",
          widget: "image",
          required: false,
          choose_url: true,
        }
      - {
          name: "tags",
          label: "Tags",
          widget: "list",
          required: false,
          hint: "One per entry, e.g. policing, policy, evidence-based-policing.",
        }
      - {
          name: "redirectFrom",
          label: "Redirect from (old paths)",
          widget: "list",
          required: false,
          hint: "If you move this article to a different section, paste its old path here (e.g. /police-policy/the-old-slug) so the old link keeps working.",
        }
      - {
          name: "draft",
          label: "Keep hidden on the live site",
          widget: "boolean",
          default: false,
          required: false,
          hint: "On = saved but not shown on the site (your way to hold a draft or take a piece down). Off = live on the next build.",
        }
      - {
          name: "body",
          label: "Body",
          widget: "markdown",
          hint: "Footnotes use [^1] in the text and [^1]: ... at the foot, as in the existing pieces.",
        }

  # Interactive articles — the handful of pieces built with layout components
  # (tabs, charts, callouts, sticky nav). These live as .mdx files so those
  # components render, which is why they don't show in the "Articles" list above
  # (that list is .md only). They're surfaced here so their details — title,
  # section, dates, images, tags, draft — stay editable in the browser.
  #
  # The one deliberate difference: the body is a plain-text box, NOT the rich
  # markdown editor. The rich editor would rewrite the embedded <Component …>
  # blocks and break the page. Edit the prose around those blocks carefully and
  # leave the component blocks themselves alone; for anything structural, edit
  # the file in the code. `create: false` because new component pieces are built
  # in code, not here.
  - name: "articles_interactive"
    label: "Interactive articles"
    label_singular: "Interactive article"
    description: "Articles built with layout components (tabs, charts, callouts). Their details are editable here; the body is shown as raw text — edit the prose carefully and leave the <Component …> blocks unchanged."
    folder: "src/content/articles"
    create: false
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "{{section}}/{{slug}}"
    thumbnail: "thumbnail"
    sortable_fields: ["pubDate", "title", "section"]
    view_groups:
      - { label: "Section", field: "section" }
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "section",
          label: "Section — change this to move the article between areas",
          widget: "select",
          default: "police-policy",
          options:
            [
              { label: "Police Policy", value: "police-policy" },
              { label: "Public Policy", value: "public-policy" },
              { label: "Influential People", value: "influential-people" },
              { label: "Interesting Distractions", value: "other" },
              { label: "The Data Tells a Story", value: "data-stories" },
            ],
        }
      - {
          name: "description",
          label: "Description — the standfirst, and the search/social summary",
          widget: "text",
        }
      - {
          name: "pubDate",
          label: "Publish date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          picker_utc: true,
        }
      - {
          name: "updatedDate",
          label: "Updated date (optional)",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          picker_utc: true,
          required: false,
        }
      - {
          name: "author",
          label: "Author",
          widget: "string",
          default: "Nathan Tracey",
          required: false,
        }
      - {
          name: "thumbnail",
          label: "Thumbnail / card image (optional)",
          widget: "image",
          required: false,
          choose_url: true,
        }
      - {
          name: "heroImage",
          label: "Hero image (optional)",
          widget: "image",
          required: false,
          choose_url: true,
        }
      - {
          name: "portrait",
          label: "Portrait (optional) — head-and-shoulders photo for Influential People cards",
          widget: "image",
          required: false,
          choose_url: true,
        }
      - {
          name: "tags",
          label: "Tags",
          widget: "list",
          required: false,
          hint: "One per entry, e.g. policing, policy, evidence-based-policing.",
        }
      - {
          name: "redirectFrom",
          label: "Redirect from (old paths)",
          widget: "list",
          required: false,
          hint: "If you move this article to a different section, paste its old path here (e.g. /police-policy/the-old-slug) so the old link keeps working.",
        }
      - {
          name: "draft",
          label: "Keep hidden on the live site",
          widget: "boolean",
          default: false,
          required: false,
          hint: "On = saved but not shown on the site (your way to hold a draft or take a piece down). Off = live on the next build.",
        }
      - {
          name: "body",
          label: "Body (raw — contains layout components)",
          widget: "text",
          hint: "This piece uses layout components (tabs, charts, callouts) written as <Component …> blocks and, at the top, import lines. Edit the prose around them carefully and leave those blocks and the imports unchanged. For structural changes, edit the file in the code.",
        }

  # Static pages — About and Contact. Editable prose; the page template handles
  # structural elements (header, email display) so the editor only touches copy.
  - name: "pages"
    label: "Pages"
    description: "The About and Contact pages. Edit the copy here; the layout is handled by the site templates."
    files:
      - name: "about"
        label: "About"
        file: "src/content/pages/about.md"
        fields:
          - { name: "title", label: "Page heading", widget: "string" }
          - { name: "description", label: "Meta description (search/social summary)", widget: "text" }
          - {
              name: "body",
              label: "Content",
              widget: "markdown",
              hint: "The photo is a standard markdown image — use the image button in the toolbar to update it.",
            }
      - name: "contact"
        label: "Contact"
        file: "src/content/pages/contact.md"
        fields:
          - { name: "title", label: "Page heading", widget: "string" }
          - { name: "description", label: "Meta description (search/social summary)", widget: "text" }
          - {
              name: "body",
              label: "Content",
              widget: "markdown",
              hint: "The email address display at the top of the page is managed by the site template, not here.",
            }
      - name: "how-i-built-this"
        label: "How I built this"
        file: "src/content/pages/how-i-built-this.md"
        fields:
          - { name: "title", label: "Page heading", widget: "string" }
          - { name: "description", label: "Meta description (search/social summary)", widget: "text" }
          - {
              name: "draft",
              label: "Keep hidden on the live site",
              widget: "boolean",
              default: false,
              required: false,
              hint: "On = the page is taken off the live site (it 404s and the nav link disappears) so you can keep rewriting it. Off = live on the next build.",
            }
          - {
              name: "body",
              label: "Content",
              widget: "markdown",
              hint: "The explainer article. The change log beneath it on the page is edited separately under the Change log collection.",
            }

  # Topics dictionary — the single source of truth behind tag suggestions, the
  # in-body auto-links, and the /topics pages. Add a topic, list the phrasings
  # it should match, and it starts linking and grouping articles automatically.
  - name: "topics"
    label: "Topics dictionary"
    description: "Subjects the site links and groups by. Each topic auto-links the first time one of its terms appears in an article."
    files:
      - name: "topics"
        label: "Topics"
        file: "src/content/topics/topics.json"
        fields:
          - name: "topics"
            label: "Topics"
            widget: "list"
            fields:
              - { name: "label", label: "Display label", widget: "string" }
              - { name: "slug", label: "URL slug", widget: "string", hint: "lowercase-hyphenated, e.g. stop-and-search" }
              - { name: "aliases", label: "Aliases / other phrasings", widget: "list", required: false, hint: "Other ways the term appears in articles, e.g. 'stop & search'." }
              - { name: "description", label: "Short description", widget: "text", required: false }

  # Books / ebooks. The site links out to wherever each is sold.
  - name: "books"
    label: "Books"
    files:
      - name: "books"
        label: "Books"
        file: "src/content/books/books.json"
        fields:
          - name: "books"
            label: "Books"
            widget: "list"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "cover", label: "Cover image", widget: "image", required: false, choose_url: true }
              - { name: "blurb", label: "Blurb", widget: "text" }
              - { name: "buyUrl", label: "Buy link (full URL)", widget: "string", hint: "Where it's sold, e.g. https://www.amazon.co.uk/..." }
              - { name: "buyLabel", label: "Button label", widget: "string", required: false, default: "Get the book" }
              - { name: "price", label: "Price (optional)", widget: "string", required: false }
              - { name: "tags", label: "Related tags", widget: "list", required: false, hint: "If one of these matches an article's tag, the book is promoted at the foot of that article." }

  # External "further reading" links (SEBP, College of Policing, …).
  - name: "resources"
    label: "Further reading"
    files:
      - name: "resources"
        label: "Further reading links"
        file: "src/content/resources/resources.json"
        fields:
          - name: "resources"
            label: "Links"
            widget: "list"
            fields:
              - { name: "label", label: "Title", widget: "string" }
              - { name: "url", label: "URL (full)", widget: "string", hint: "Include https://" }
              - { name: "note", label: "Note (optional)", widget: "text", required: false }
              - { name: "category", label: "Category (optional)", widget: "string", required: false, hint: "Groups links on the page, e.g. 'Evidence and research'." }

  # Change log — the running list of changes shown beneath the "How I built
  # this" page. Add an entry whenever something changes; newest is shown first.
  - name: "changelog"
    label: "Change log"
    description: "The running list of site changes shown on the 'How I built this' page. Add a new entry at the top whenever something changes."
    files:
      - name: "changelog"
        label: "Change log entries"
        file: "src/content/changelog/changelog.json"
        fields:
          - name: "changelog"
            label: "Entries"
            widget: "list"
            label_singular: "Entry"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { name: "title", label: "Title", widget: "string", hint: "A short headline for the change, e.g. 'Fixed a broken link in the stop & search piece'." }
              - { name: "description", label: "What changed and why", widget: "text" }
              - {
                  name: "type",
                  label: "Type (optional)",
                  widget: "select",
                  required: false,
                  options:
                    [
                      { label: "New — a new page or feature", value: "new" },
                      { label: "Fix — something corrected", value: "fix" },
                      { label: "Update — content refreshed", value: "update" },
                      { label: "Article — a new piece published", value: "article" },
                      { label: "Note — a learning note", value: "note" },
                    ],
                }
