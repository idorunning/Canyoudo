<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep the editor out of search engines. -->
    <meta name="robots" content="noindex" />
    <title>Content manager · Thinking About Policing</title>
  </head>
  <body>
    <!-- Sveltia CMS: a Git-based editor (Decap-compatible, same config.yml).
         It commits Markdown straight into the repository, so the articles it
         writes are read by Astro's content collections exactly like the
         hand-written ones. Compared with Decap it adds a proper asset library
         for /images, drag-and-drop uploads, automatic WebP conversion, and a
         much faster UI. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
    <!-- Rollback: if Sveltia ever misbehaves, comment it out above and restore
         the Decap line below — the config needs no changes either way. -->
    <!-- <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script> -->
  </body>
</html>
