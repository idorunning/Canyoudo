<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The National Decision Model as five stages in a ring around a central Code of Ethics, applied to a domestic abuse grading decision. Stage one, at the top: gather information and intelligence — history, markers, children, previous calls. Stage two, upper right: assess threat and risk and develop a working strategy — hold it against the definition. Stage three, lower right: consider powers and policy — the Domestic Abuse Act, orders, positive action. Stage four, lower left: identify options and contingencies — the safeguarding the grade triggers. Stage five, upper left: take action and review — do it, and write the reason. The flow runs clockwise, with the Code of Ethics at the centre of every stage.">
  <defs>
    <style>
      .fig { font-family: 'DM Sans', system-ui, sans-serif; }
      .serif { font-family: Fraunces, Georgia, serif; }
      .bodyserif { font-family: 'Source Serif 4', Georgia, serif; }
      .spin { transform-box: view-box; transform-origin: 600px 500px; }
      .ringrot { animation: spin 48s linear infinite; }
      .flowdot { animation: spin 20s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .glow { opacity: 0; animation: nodepulse 12.5s ease-in-out infinite; }
      @keyframes nodepulse {
        0% { opacity: 0; } 3% { opacity: .85; } 15% { opacity: .85; } 20% { opacity: 0; } 100% { opacity: 0; }
      }
      .cpulse { transform-box: fill-box; transform-origin: center; animation: cpulse 3.4s ease-in-out infinite; }
      @keyframes cpulse {
        0%,100% { transform: scale(1); opacity: .5; }
        50% { transform: scale(1.14); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ringrot,.flowdot,.cpulse { animation: none !important; }
        .glow { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f7f3eb"/>
  <text x="600" y="54" class="serif" fill="#1a1817" font-size="40" font-weight="600" text-anchor="middle">The National Decision Model</text>
  <text x="600" y="90" class="bodyserif" fill="#5a544e" font-size="21" font-style="italic" text-anchor="middle">run a grading decision around the wheel and the answer comes with a reason</text>

  <!-- static base ring + rotating dashed ring -->
  <circle cx="600" cy="500" r="280" fill="none" stroke="#e6ddcc" stroke-width="2"/>
  <circle class="spin ringrot" cx="600" cy="500" r="280" fill="none" stroke="#c9a98f" stroke-width="3" stroke-dasharray="2 16" stroke-linecap="round"/>

  <!-- clockwise arrowheads on the ring -->
  <g fill="#c2a98f">
    <path d="M 742 248 l 20 -3 l -11 17 z"/>
    <path d="M 832 654 l 14 15 l -20 4 z"/>
    <path d="M 470 673 l -20 -4 l 14 -15 z"/>
    <path d="M 358 245 l -9 -18 l 20 4 z"/>
  </g>

  <!-- travelling flow pulse -->
  <g class="spin flowdot">
    <circle cx="600" cy="220" r="16" fill="#a14545" fill-opacity="0.28"/>
    <circle cx="600" cy="220" r="8" fill="#a14545"/>
  </g>

  <!-- centre: Code of Ethics -->
  <circle class="cpulse" cx="600" cy="500" r="100" fill="none" stroke="#a14545" stroke-width="3"/>
  <circle cx="600" cy="500" r="100" fill="#7c2828"/>
  <text x="600" y="486" class="serif" fill="#f5f1e8" font-size="27" font-weight="600" text-anchor="middle">Code of</text>
  <text x="600" y="520" class="serif" fill="#f5f1e8" font-size="27" font-weight="600" text-anchor="middle">Ethics</text>
  <text x="600" y="552" class="fig" fill="#e3b9b9" font-size="14" font-style="italic" text-anchor="middle">at the centre</text>

  <!-- ===================== nodes ===================== -->
  <g class="fig" text-anchor="middle">

    <!-- 1: top (600,220) -->
    <circle class="glow" style="animation-delay:0s" cx="600" cy="220" r="100" fill="none" stroke="#a14545" stroke-width="6"/>
    <circle cx="600" cy="220" r="92" fill="#fbf8f1" stroke="#a14545" stroke-width="2.5"/>
    <text x="600" y="200" class="serif" fill="#7c2828" font-size="30" font-weight="700">1</text>
    <text x="600" y="232" fill="#3d3936" font-size="16" font-weight="600">Gather information</text>
    <text x="600" y="254" fill="#3d3936" font-size="16" font-weight="600">&amp; intelligence</text>
    <text x="600" y="126" fill="#7a7268" font-size="14" font-style="italic">history, markers, children, previous calls</text>

    <!-- 2: upper right (866,414) -->
    <circle class="glow" style="animation-delay:2.5s" cx="866" cy="414" r="100" fill="none" stroke="#a14545" stroke-width="6"/>
    <circle cx="866" cy="414" r="92" fill="#fbf8f1" stroke="#a14545" stroke-width="2.5"/>
    <text x="866" y="394" class="serif" fill="#7c2828" font-size="30" font-weight="700">2</text>
    <text x="866" y="426" fill="#3d3936" font-size="16" font-weight="600">Assess threat &amp; risk;</text>
    <text x="866" y="448" fill="#3d3936" font-size="16" font-weight="600">working strategy</text>
    <text x="972" y="404" fill="#7a7268" font-size="14" font-style="italic" text-anchor="start">hold it against</text>
    <text x="972" y="424" fill="#7a7268" font-size="14" font-style="italic" text-anchor="start">the definition</text>

    <!-- 3: lower right (765,727) -->
    <circle class="glow" style="animation-delay:5s" cx="765" cy="727" r="100" fill="none" stroke="#a14545" stroke-width="6"/>
    <circle cx="765" cy="727" r="92" fill="#fbf8f1" stroke="#a14545" stroke-width="2.5"/>
    <text x="765" y="707" class="serif" fill="#7c2828" font-size="30" font-weight="700">3</text>
    <text x="765" y="739" fill="#3d3936" font-size="16" font-weight="600">Consider powers</text>
    <text x="765" y="761" fill="#3d3936" font-size="16" font-weight="600">&amp; policy</text>
    <text x="765" y="850" fill="#7a7268" font-size="14" font-style="italic">DA Act, orders, positive action</text>

    <!-- 4: lower left (435,727) -->
    <circle class="glow" style="animation-delay:7.5s" cx="435" cy="727" r="100" fill="none" stroke="#a14545" stroke-width="6"/>
    <circle cx="435" cy="727" r="92" fill="#fbf8f1" stroke="#a14545" stroke-width="2.5"/>
    <text x="435" y="707" class="serif" fill="#7c2828" font-size="30" font-weight="700">4</text>
    <text x="435" y="739" fill="#3d3936" font-size="16" font-weight="600">Identify options</text>
    <text x="435" y="761" fill="#3d3936" font-size="16" font-weight="600">&amp; contingencies</text>
    <text x="435" y="850" fill="#7a7268" font-size="14" font-style="italic">the safeguarding the grade triggers</text>

    <!-- 5: upper left (334,414) -->
    <circle class="glow" style="animation-delay:10s" cx="334" cy="414" r="100" fill="none" stroke="#a14545" stroke-width="6"/>
    <circle cx="334" cy="414" r="92" fill="#fbf8f1" stroke="#a14545" stroke-width="2.5"/>
    <text x="334" y="394" class="serif" fill="#7c2828" font-size="30" font-weight="700">5</text>
    <text x="334" y="426" fill="#3d3936" font-size="16" font-weight="600">Take action</text>
    <text x="334" y="448" fill="#3d3936" font-size="16" font-weight="600">&amp; review</text>
    <text x="228" y="404" fill="#7a7268" font-size="14" font-style="italic" text-anchor="end">do it, write</text>
    <text x="228" y="424" fill="#7a7268" font-size="14" font-style="italic" text-anchor="end">the reason</text>
  </g>

  <text x="600" y="886" class="fig" fill="#8a8175" font-size="18" font-style="italic" text-anchor="middle">College of Policing, National Decision Model. The Code of Ethics sits at the centre of every stage.</text>
</svg>
