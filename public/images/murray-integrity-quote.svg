<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Quote from Alex Murray: The heart of evidence-based policing is about integrity.">
  <rect width="1200" height="440" fill="#1a1817"/>
  <rect x="0" y="0" width="10" height="440" fill="#7c2828"/>
  <text x="78" y="220" fill="#3d3936" font-family="Fraunces, Georgia, serif" font-size="240" font-weight="700">&#8220;</text>
  <text x="150" y="180" fill="#fbf8f1" font-family="Fraunces, Georgia, serif" font-size="50" font-weight="500"><tspan x="150">The heart of evidence-based</tspan><tspan x="150" dy="68">policing is about integrity.</tspan></text>
  <text x="150" y="350" fill="#a14545" font-family="'DM Sans', system-ui, sans-serif" font-size="23" font-weight="600" letter-spacing="3">ALEX MURRAY</text>
  <text x="150" y="384" fill="#9c9389" font-family="'DM Sans', system-ui, sans-serif" font-size="20">Founder of the Society of Evidence-Based Policing</text>
</svg>
