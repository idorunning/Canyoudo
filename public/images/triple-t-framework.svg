<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Sherman's Triple-T framework: Targeting, Testing and Tracking">
  <rect width="1200" height="540" fill="#f7f3eb"/>
  <text x="600" y="78" fill="#1a1817" font-family="Fraunces, Georgia, serif" font-size="46" font-weight="600" text-anchor="middle">Sherman&#8217;s Triple-T</text>
  <text x="600" y="120" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="24" font-style="italic" text-anchor="middle">the method Murray carried from Cambridge into British policing</text>

  <!-- Card 1: Targeting -->
  <rect x="60" y="175" width="320" height="285" rx="14" fill="#fbf8f1" stroke="#ddd6c8" stroke-width="1.5"/>
  <rect x="60" y="175" width="320" height="8" rx="4" fill="#7c2828"/>
  <text x="220" y="250" fill="#7c2828" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" text-anchor="middle">Targeting</text>
  <text x="220" y="312" fill="#3d3936" font-family="'Source Serif 4', Georgia, serif" font-size="22" text-anchor="middle"><tspan x="220">Find the few places,</tspan><tspan x="220" dy="32">times and people that</tspan><tspan x="220" dy="32">cause most of the harm.</tspan></text>

  <!-- Card 2: Testing -->
  <rect x="440" y="175" width="320" height="285" rx="14" fill="#fbf8f1" stroke="#ddd6c8" stroke-width="1.5"/>
  <rect x="440" y="175" width="320" height="8" rx="4" fill="#7c2828"/>
  <text x="600" y="250" fill="#7c2828" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" text-anchor="middle">Testing</text>
  <text x="600" y="312" fill="#3d3936" font-family="'Source Serif 4', Georgia, serif" font-size="22" text-anchor="middle"><tspan x="600">Run controlled trials to</tspan><tspan x="600" dy="32">see what actually works</tspan><tspan x="600" dy="32">&#8212; and what backfires.</tspan></text>

  <!-- Card 3: Tracking -->
  <rect x="820" y="175" width="320" height="285" rx="14" fill="#fbf8f1" stroke="#ddd6c8" stroke-width="1.5"/>
  <rect x="820" y="175" width="320" height="8" rx="4" fill="#7c2828"/>
  <text x="980" y="250" fill="#7c2828" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" text-anchor="middle">Tracking</text>
  <text x="980" y="312" fill="#3d3936" font-family="'Source Serif 4', Georgia, serif" font-size="22" text-anchor="middle"><tspan x="980">Monitor whether the</tspan><tspan x="980" dy="32">effect holds once it is</tspan><tspan x="980" dy="32">in daily use.</tspan></text>

  <!-- Arrows -->
  <path d="M 398 305 l 24 12 l -24 12" fill="none" stroke="#a14545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 778 305 l 24 12 l -24 12" fill="none" stroke="#a14545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="505" fill="#7a7268" font-family="'DM Sans', system-ui, sans-serif" font-size="19" font-style="italic" text-anchor="middle">After Lawrence Sherman&#8217;s &#8220;Triple-T&#8221; replacement for the old three Rs of policing.</text>
</svg>
