<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Two ways to use a probability word, on a shared 0 to 100 percent scale. Top: the words 'possible', 'real possibility' and 'likely' shown as wide, overlapping bands, because people read them so differently — 'possible' spans about 10 to 70 percent, 'real possibility' about 20 to 80 percent, 'likely' about 55 to 90 percent. Bottom: the PHIA Probability Yardstick, which fixes each term to a defined, non-overlapping band — remote chance up to 5 percent, highly unlikely 10 to 20, unlikely 25 to 35, realistic possibility 40 to just under 50, likely or probably 55 to 75, highly likely 80 to 90, almost certain 95 percent or more.">
  <defs>
    <style>
      .fig { font-family: 'DM Sans', system-ui, sans-serif; }
      .serif { font-family: Fraunces, Georgia, serif; }
      .bodyserif { font-family: 'Source Serif 4', Georgia, serif; }
      .fade { opacity: 0; animation: fade .7s ease forwards; }
      @keyframes fade { to { opacity: 1; } }
      .softband {
        transform: scaleX(0);
        transform-box: fill-box;
        transform-origin: center;
        animation: growx .9s cubic-bezier(.2,.7,.3,1) forwards, breathe 3.4s ease-in-out infinite;
      }
      .fixband {
        transform: scaleX(0);
        transform-box: fill-box;
        transform-origin: center;
        animation: growx .55s cubic-bezier(.2,.8,.25,1) forwards;
      }
      @keyframes growx { to { transform: scaleX(1); } }
      @keyframes breathe {
        0%,100% { transform: scaleX(1); }
        50% { transform: scaleX(1.022); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade { opacity: 1 !important; animation: none !important; }
        .softband,.fixband { transform: scaleX(1) !important; animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f7f3eb"/>
  <text x="600" y="60" class="serif" fill="#1a1817" font-size="40" font-weight="600" text-anchor="middle">Two ways to use a probability word</text>

  <!-- shared vertical gridlines -->
  <g stroke="#e6ddcc" stroke-width="1">
    <line x1="140" y1="170" x2="140" y2="648"/>
    <line x1="385" y1="170" x2="385" y2="648"/>
    <line x1="630" y1="170" x2="630" y2="648"/>
    <line x1="875" y1="170" x2="875" y2="648"/>
    <line x1="1120" y1="170" x2="1120" y2="648"/>
  </g>

  <!-- ===================== TOP: drifting words ===================== -->
  <text x="140" y="126" class="fig fade" fill="#7c2828" font-size="22" font-weight="600">Left to themselves, the words drift and overlap</text>
  <text x="140" y="154" class="bodyserif fade" fill="#7a7268" font-size="19" font-style="italic">the spread of numbers people give when asked to put a % on each word</text>

  <!-- possible 10-70% : x 238..826 -->
  <rect class="softband" style="animation-delay:.3s, 1.2s" x="238" y="182" width="588" height="48" rx="9" fill="#a14545" fill-opacity="0.28" stroke="#a14545" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="252" y="212" class="fig fade" style="animation-delay:.6s" fill="#7c2828" font-size="21" font-weight="600">possible</text>

  <!-- real possibility 20-80% : x 336..924 -->
  <rect class="softband" style="animation-delay:.45s, 1.35s" x="336" y="240" width="588" height="48" rx="9" fill="#a14545" fill-opacity="0.28" stroke="#a14545" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="350" y="270" class="fig fade" style="animation-delay:.75s" fill="#7c2828" font-size="21" font-weight="600">real possibility</text>

  <!-- likely 55-90% : x 679..1022 -->
  <rect class="softband" style="animation-delay:.6s, 1.5s" x="679" y="298" width="343" height="48" rx="9" fill="#7c2828" fill-opacity="0.30" stroke="#7c2828" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="693" y="328" class="fig fade" style="animation-delay:.9s" fill="#7c2828" font-size="21" font-weight="600">likely</text>

  <!-- ===================== BOTTOM: PHIA Yardstick ===================== -->
  <text x="140" y="428" class="fig fade" style="animation-delay:1.3s" fill="#7c2828" font-size="22" font-weight="600">Pinned down: the UK intelligence Probability Yardstick</text>
  <text x="140" y="456" class="bodyserif fade" style="animation-delay:1.3s" fill="#7a7268" font-size="19" font-style="italic">each term fixed to its own band, so everyone reads the same odds</text>

  <!-- fixed bands, y=474 h=56 -->
  <rect class="fixband" style="animation-delay:1.5s"  x="140"  y="474" width="49"  height="56" rx="5" fill="#e3c9c0"/>
  <rect class="fixband" style="animation-delay:1.62s" x="238"  y="474" width="98"  height="56" rx="5" fill="#d9b0a3"/>
  <rect class="fixband" style="animation-delay:1.74s" x="385"  y="474" width="98"  height="56" rx="5" fill="#cd9485"/>
  <rect class="fixband" style="animation-delay:1.86s" x="532"  y="474" width="88"  height="56" rx="5" fill="#bf7a69"/>
  <rect class="fixband" style="animation-delay:1.98s" x="679"  y="474" width="196" height="56" rx="5" fill="#a8564a"/>
  <rect class="fixband" style="animation-delay:2.10s" x="924"  y="474" width="98"  height="56" rx="5" fill="#8d4035"/>
  <rect class="fixband" style="animation-delay:2.22s" x="1071" y="474" width="49"  height="56" rx="5" fill="#7c2828"/>

  <!-- staggered term labels with connector ticks -->
  <g class="fig fade" style="animation-delay:2.4s" font-size="16" fill="#3d3936" text-anchor="middle">
    <line x1="164" y1="530" x2="164" y2="550" stroke="#c9b8a0" stroke-width="1"/>
    <text x="164" y="568">remote</text>
    <text x="164" y="586">chance</text>

    <line x1="287" y1="530" x2="287" y2="602" stroke="#c9b8a0" stroke-width="1"/>
    <text x="287" y="620">highly</text>
    <text x="287" y="638">unlikely</text>

    <line x1="434" y1="530" x2="434" y2="550" stroke="#c9b8a0" stroke-width="1"/>
    <text x="434" y="568">unlikely</text>

    <line x1="576" y1="530" x2="576" y2="602" stroke="#c9b8a0" stroke-width="1"/>
    <text x="576" y="620">realistic</text>
    <text x="576" y="638">possibility</text>

    <line x1="777" y1="530" x2="777" y2="550" stroke="#c9b8a0" stroke-width="1"/>
    <text x="777" y="568" font-weight="600" fill="#7c2828">likely / probably</text>

    <line x1="973" y1="530" x2="973" y2="602" stroke="#c9b8a0" stroke-width="1"/>
    <text x="973" y="620">highly</text>
    <text x="973" y="638">likely</text>

    <line x1="1096" y1="530" x2="1096" y2="550" stroke="#c9b8a0" stroke-width="1"/>
    <text x="1096" y="568">almost</text>
    <text x="1096" y="586">certain</text>
  </g>

  <!-- shared percentage axis -->
  <line x1="140" y1="662" x2="1120" y2="662" stroke="#c9c0b0" stroke-width="1.5"/>
  <g class="fig" font-size="16" fill="#7a7268" text-anchor="middle">
    <text x="140" y="686">0%</text>
    <text x="385" y="686">25%</text>
    <text x="630" y="686">50%</text>
    <text x="875" y="686">75%</text>
    <text x="1120" y="686">100%</text>
  </g>

  <text x="600" y="734" class="fig fade" style="animation-delay:2.6s" fill="#8a8175" font-size="17" font-style="italic" text-anchor="middle">Word ranges from Kent (CIA) and the Mauboussin HBR survey; fixed bands from the PHIA Probability Yardstick.</text>
</svg>
