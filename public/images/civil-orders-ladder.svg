<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The escalation ladder of anti-social behaviour powers. Rung one: informal action — words of advice, warning letters, acceptable behaviour contracts. Rung two: Community Protection Warning, a written warning. Rung three: Community Protection Notice, whose breach is a criminal offence. Rung four: an order — a civil injunction or a Criminal Behaviour Order — imposed by a court, with breach punishable as contempt or by up to five years. Formality, evidence and consequences increase up the ladder. Closure notices and orders run alongside it for premises.">
  <rect width="1200" height="760" fill="#f7f3eb"/>
  <text x="600" y="62" fill="#1a1817" font-family="Fraunces, Georgia, serif" font-size="42" font-weight="600" text-anchor="middle">The escalation ladder</text>
  <text x="600" y="102" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-style="italic" text-anchor="middle">the law expects you to climb it, rung by rung &#8212; and to show why</text>

  <!-- vertical "increasing" axis -->
  <line x1="44" y1="640" x2="44" y2="200" stroke="#c4bcae" stroke-width="2.5"/>
  <path d="M 44 188 l -7 16 l 14 0 z" fill="#c4bcae"/>
  <text x="30" y="430" fill="#9c9389" font-family="'DM Sans', system-ui, sans-serif" font-size="16" letter-spacing="0.1em" text-anchor="middle" transform="rotate(-90 30 430)">FORMALITY &#183; EVIDENCE &#183; CONSEQUENCE</text>

  <!-- Rung 1 -->
  <rect x="80" y="520" width="300" height="120" rx="10" fill="#fbf8f1" stroke="#9c9389" stroke-width="1.5"/>
  <rect x="80" y="520" width="300" height="8" rx="4" fill="#9c9389"/>
  <text x="356" y="612" fill="#e7e0d2" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="700" text-anchor="end">1</text>
  <text x="100" y="566" fill="#3d3936" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700">Informal action</text>
  <text x="100" y="594" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="16">Words of advice, warning</text>
  <text x="100" y="616" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="16">letters, acceptable behaviour contracts</text>

  <!-- Rung 2 -->
  <rect x="350" y="420" width="300" height="120" rx="10" fill="#fbf8f1" stroke="#c98e7f" stroke-width="1.5"/>
  <rect x="350" y="420" width="300" height="8" rx="4" fill="#c98e7f"/>
  <text x="626" y="512" fill="#f0ddd6" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="700" text-anchor="end">2</text>
  <text x="370" y="466" fill="#3d3936" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700">Community Protection</text>
  <text x="370" y="490" fill="#3d3936" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700">Warning (CPW)</text>
  <text x="370" y="518" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="16">Written warning: stop, or a notice follows</text>

  <!-- Rung 3 -->
  <rect x="620" y="320" width="300" height="120" rx="10" fill="#fbf8f1" stroke="#a14545" stroke-width="1.5"/>
  <rect x="620" y="320" width="300" height="8" rx="4" fill="#a14545"/>
  <text x="896" y="412" fill="#eccfc9" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="700" text-anchor="end">3</text>
  <text x="640" y="366" fill="#3d3936" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700">Community Protection</text>
  <text x="640" y="390" fill="#3d3936" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700">Notice (CPN)</text>
  <text x="640" y="418" fill="#7c2828" font-family="'Source Serif 4', Georgia, serif" font-size="16" font-style="italic">Breach is a criminal offence</text>

  <!-- Rung 4 -->
  <rect x="880" y="220" width="300" height="120" rx="10" fill="#fbf8f1" stroke="#7c2828" stroke-width="2"/>
  <rect x="880" y="220" width="300" height="8" rx="4" fill="#7c2828"/>
  <text x="1156" y="312" fill="#e6c4c4" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="700" text-anchor="end">4</text>
  <text x="900" y="266" fill="#3d3936" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700">An order</text>
  <text x="900" y="290" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="16">Civil injunction or CBO; a court</text>
  <text x="900" y="312" fill="#7c2828" font-family="'Source Serif 4', Georgia, serif" font-size="16">order. <tspan font-style="italic">Breach: contempt, or jail.</tspan></text>

  <text x="600" y="710" fill="#7a7268" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-style="italic" text-anchor="middle">Closure notices and orders run alongside the ladder for premises &#8212; a cuckooed flat, a problem address &#8212; not just individuals.</text>
</svg>
