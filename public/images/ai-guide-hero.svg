  <text x="120" y="372" fill="#f5f1e8" font-family="'DM Sans', system-ui, sans-serif" font-size="108" font-weight="600">A Plain-English</text>
  <text x="120" y="492" fill="#f5f1e8" font-family="'DM Sans', system-ui, sans-serif" font-size="108" font-weight="600">Guide to AI</text>
  <text x="120" y="612" fill="#bdb4a8" font-family="'Source Serif 4', Georgia, serif" font-size="40" font-style="italic">For the police leader who was never handed the manual.</text>
  <text x="120" y="724" fill="#8a8175" font-family="'DM Sans', system-ui, sans-serif" font-size="29">What the words mean &#183; what it can and can&#8217;t do &#183; how it uses your data &#183; the risks to own.</text>
