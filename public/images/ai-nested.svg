<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="AI contains machine learning, which contains deep learning, which contains generative AI and large language models">
  <rect width="1200" height="820" fill="#fbf8f1"/>

  <!-- Outer: AI -->
  <rect x="40" y="40" width="1120" height="740" rx="20" fill="#ffffff" stroke="#c4bcae" stroke-width="2"/>
  <text x="80" y="95" fill="#1a1817" font-family="'DM Sans', system-ui, sans-serif" font-size="30" font-weight="600">Artificial Intelligence</text>
  <text x="80" y="128" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="22">Machines doing tasks that used to need human judgement.</text>

  <!-- Machine learning -->
  <rect x="90" y="160" width="1020" height="580" rx="18" fill="#f7f3eb" stroke="#c4bcae" stroke-width="2"/>
  <text x="130" y="213" fill="#1a1817" font-family="'DM Sans', system-ui, sans-serif" font-size="28" font-weight="600">Machine Learning</text>
  <text x="130" y="245" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="22">Systems that learn patterns from examples, instead of being given hand-written rules.</text>

  <!-- Deep learning -->
  <rect x="150" y="280" width="900" height="430" rx="16" fill="#ede5d3" stroke="#a14545" stroke-width="2"/>
  <text x="190" y="333" fill="#1a1817" font-family="'DM Sans', system-ui, sans-serif" font-size="26" font-weight="600">Deep Learning</text>
  <text x="190" y="365" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="22">Many-layered &#8220;neural networks&#8221; that learn very complex patterns from very large data.</text>

  <!-- Generative AI / LLMs -->
  <rect x="210" y="400" width="780" height="280" rx="14" fill="#7c2828"/>
  <text x="250" y="455" fill="#fbf8f1" font-family="'DM Sans', system-ui, sans-serif" font-size="26" font-weight="600">Generative AI &#183; Large Language Models</text>
  <text x="250" y="492" fill="#f3e3e0" font-family="'Source Serif 4', Georgia, serif" font-size="22">Models that produce new text, images or code on demand.</text>
  <text x="250" y="556" fill="#f3e3e0" font-family="'Source Serif 4', Georgia, serif" font-size="22">This is the part you have heard most about:</text>
  <text x="250" y="592" fill="#ffffff" font-family="'DM Sans', system-ui, sans-serif" font-size="24" font-weight="600">ChatGPT &#183; Microsoft Copilot &#183; Gemini &#183; Claude</text>
  <text x="250" y="640" fill="#e9c9c6" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-style="italic">Powerful, fluent &#8212; and the least predictable to govern.</text>
</svg>
