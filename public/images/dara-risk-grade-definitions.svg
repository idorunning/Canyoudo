<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="The three domestic abuse risk grades and their definitions. Standard: current evidence does not indicate likelihood of causing serious harm. Medium: there are identifiable indicators of risk of serious harm; the offender has the potential to cause serious harm but is unlikely to do so unless there is a change in circumstances. High: there are identifiable indicators of risk of serious harm; the potential event could happen at any time and the impact would be serious.">
  <rect width="1200" height="680" fill="#f7f3eb"/>
  <text x="600" y="68" fill="#1a1817" font-family="Fraunces, Georgia, serif" font-size="42" font-weight="600" text-anchor="middle">What the grades actually mean</text>
  <text x="600" y="108" fill="#5a544e" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-style="italic" text-anchor="middle">the hinge is timing and trigger, not how worried you feel</text>

  <!-- Standard -->
  <rect x="50" y="150" width="350" height="460" rx="14" fill="#fbf8f1" stroke="#ddd6c8" stroke-width="1.5"/>
  <rect x="50" y="150" width="350" height="10" rx="5" fill="#9a9488"/>
  <text x="225" y="212" fill="#5a544e" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" text-anchor="middle">Standard</text>
  <line x1="86" y1="244" x2="364" y2="244" stroke="#ddd6c8" stroke-width="2"/>
  <g font-family="'Source Serif 4', Georgia, serif" font-size="23" fill="#3d3936">
    <text x="86" y="300">Current evidence does</text>
    <text x="86" y="334">not indicate likelihood</text>
    <text x="86" y="368">of causing serious harm.</text>
  </g>
  <text x="225" y="560" fill="#7c2828" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">A decision to do</text>
  <text x="225" y="586" fill="#7c2828" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">no further safeguarding</text>

  <!-- Medium -->
  <rect x="425" y="150" width="350" height="460" rx="14" fill="#fbf8f1" stroke="#ddd6c8" stroke-width="1.5"/>
  <rect x="425" y="150" width="350" height="10" rx="5" fill="#a14545"/>
  <text x="600" y="212" fill="#7c2828" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" text-anchor="middle">Medium</text>
  <line x1="461" y1="244" x2="739" y2="244" stroke="#ddd6c8" stroke-width="2"/>
  <g font-family="'Source Serif 4', Georgia, serif" font-size="23" fill="#3d3936">
    <text x="461" y="290">There are identifiable</text>
    <text x="461" y="322">indicators of risk of</text>
    <text x="461" y="354">serious harm. The offender</text>
    <text x="461" y="386">has the potential to cause</text>
    <text x="461" y="418">serious harm but is</text>
    <text x="461" y="450">unlikely to do so unless</text>
    <text x="461" y="482">there is a change in</text>
    <text x="461" y="514">circumstances.</text>
  </g>
  <text x="600" y="570" fill="#7c2828" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Serious harm: unlikely</text>
  <text x="600" y="596" fill="#7c2828" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">unless something changes</text>

  <!-- High -->
  <rect x="800" y="150" width="350" height="460" rx="14" fill="#fbf8f1" stroke="#ddd6c8" stroke-width="1.5"/>
  <rect x="800" y="150" width="350" height="10" rx="5" fill="#7c2828"/>
  <text x="975" y="212" fill="#7c2828" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" text-anchor="middle">High</text>
  <line x1="836" y1="244" x2="1114" y2="244" stroke="#ddd6c8" stroke-width="2"/>
  <g font-family="'Source Serif 4', Georgia, serif" font-size="23" fill="#3d3936">
    <text x="836" y="300">There are identifiable</text>
    <text x="836" y="332">indicators of risk of</text>
    <text x="836" y="364">serious harm. The potential</text>
    <text x="836" y="396">event could happen at</text>
    <text x="836" y="428">any time and the impact</text>
    <text x="836" y="460">would be serious.</text>
  </g>
  <text x="975" y="570" fill="#7c2828" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Serious harm: could</text>
  <text x="975" y="596" fill="#7c2828" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">happen at any time</text>

  <text x="600" y="660" fill="#7a7268" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-style="italic" text-anchor="middle">Definitions via the OASys / SafeLives DASH lineage, carried into the College of Policing&#8217;s DARA.</text>
</svg>
