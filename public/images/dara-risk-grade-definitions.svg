<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="How the three domestic abuse risk grades are actually decided, shown as two questions. First question: are there identifiable indicators of risk of serious harm? If no, the grade is Standard — current evidence does not indicate a likelihood of serious harm, a decision to do no further safeguarding. If yes, a second question: could serious harm happen at any time? If no — only if circumstances change — the grade is Medium: indicators are present but serious harm is unlikely unless circumstances change; act now with a referral, follow-up or marker. If yes, the grade is High: indicators are present and serious harm could happen at any time; immediate active safeguarding. Definitions via the OASys and SafeLives DASH lineage, carried into the College of Policing's DARA.">
  <defs>
    <style>
      .fig { font-family: 'DM Sans', system-ui, sans-serif; }
      .serif { font-family: Fraunces, Georgia, serif; }
      .bodyserif { font-family: 'Source Serif 4', Georgia, serif; }
      .fade { opacity: 0; animation: fade .7s ease forwards; }
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s ease forwards; }
      .rise { opacity: 0; transform: translateY(14px); animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
      @keyframes fade { to { opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes hinge {
        0%,100% { opacity: .0; }
        50% { opacity: .55; }
      }
      .hingeglow { animation: hinge 2.8s ease-in-out infinite; animation-delay: 2.6s; }
      @media (prefers-reduced-motion: reduce) {
        .fade,.draw,.rise { opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; animation: none !important; }
        .hingeglow { animation: none; opacity: .4; }
      }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#f7f3eb"/>

  <text x="640" y="66" class="serif" fill="#1a1817" font-size="42" font-weight="600" text-anchor="middle">How the grade is actually decided</text>
  <text x="640" y="106" class="bodyserif" fill="#5a544e" font-size="22" font-style="italic" text-anchor="middle">two questions, not a feeling &#8212; the hinge is timing and trigger</text>

  <!-- ============ connectors (drawn first, behind nodes) ============ -->
  <!-- Q1 -> split -->
  <path class="draw" style="animation-delay:.7s" d="M640 230 V262 H275 V300" fill="none" stroke="#c9b8a0" stroke-width="2.5" pathLength="1"/>
  <path class="draw" style="animation-delay:.7s" d="M640 230 V262 H900 V292" fill="none" stroke="#c9b8a0" stroke-width="2.5" pathLength="1"/>
  <!-- Q2 -> split -->
  <path class="draw" style="animation-delay:2.1s" d="M900 372 V404 H720 V520" fill="none" stroke="#c9b8a0" stroke-width="2.5" pathLength="1"/>
  <path class="draw" style="animation-delay:2.1s" d="M900 372 V404 H1085 V520" fill="none" stroke="#c9b8a0" stroke-width="2.5" pathLength="1"/>

  <!-- branch labels -->
  <g class="fade fig" style="animation-delay:1.3s" font-size="17" font-weight="600" text-anchor="middle">
    <rect x="392" y="243" width="52" height="30" rx="15" fill="#efe7d7"/>
    <text x="418" y="264" fill="#5a544e">No</text>
    <rect x="770" y="243" width="56" height="30" rx="15" fill="#efe7d7"/>
    <text x="798" y="264" fill="#7c2828">Yes</text>
  </g>
  <g class="fade fig" style="animation-delay:2.7s" font-size="17" font-weight="600" text-anchor="middle">
    <rect x="694" y="385" width="52" height="30" rx="15" fill="#efe7d7"/>
    <text x="720" y="406" fill="#a14545">No</text>
    <rect x="1059" y="385" width="56" height="30" rx="15" fill="#efe7d7"/>
    <text x="1087" y="406" fill="#7c2828">Yes</text>
  </g>
  <text x="720" y="446" class="fade bodyserif" style="animation-delay:2.7s" font-size="16" font-style="italic" fill="#7a7268" text-anchor="middle">only if circumstances change</text>

  <!-- ============ Q1 pill ============ -->
  <g class="fade" style="animation-delay:0s">
    <rect x="280" y="152" width="720" height="78" rx="39" fill="#fbf8f1" stroke="#a14545" stroke-width="2.5"/>
    <text x="640" y="188" class="fig" fill="#3d3936" font-size="24" font-weight="600" text-anchor="middle">Are there identifiable indicators of</text>
    <text x="640" y="216" class="fig" fill="#3d3936" font-size="24" font-weight="600" text-anchor="middle">risk of serious harm?</text>
  </g>

  <!-- ============ Q2 pill (the hinge) ============ -->
  <g class="fade" style="animation-delay:1.9s">
    <rect class="hingeglow" x="629" y="286" width="542" height="86" rx="43" fill="none" stroke="#7c2828" stroke-width="9"/>
    <rect x="635" y="292" width="530" height="74" rx="37" fill="#fbf8f1" stroke="#7c2828" stroke-width="2.5"/>
    <text x="900" y="326" class="fig" fill="#3d3936" font-size="23" font-weight="600" text-anchor="middle">Could serious harm happen</text>
    <text x="900" y="354" class="fig" fill="#3d3936" font-size="23" font-weight="600" text-anchor="middle">at <tspan font-style="italic" fill="#7c2828">any time</tspan>?</text>
    <text x="900" y="270" class="fig" fill="#7c2828" font-size="15" font-weight="600" letter-spacing="3" text-anchor="middle">THE HINGE</text>
  </g>

  <!-- ============ Standard card ============ -->
  <g class="rise" style="animation-delay:1.3s">
    <rect x="100" y="300" width="350" height="238" rx="14" fill="#fbf8f1" stroke="#ddd6c8" stroke-width="1.5"/>
    <rect x="100" y="300" width="350" height="11" rx="5.5" fill="#9a9488"/>
    <text x="128" y="356" class="serif" fill="#5a544e" font-size="32" font-weight="600">Standard</text>
    <g class="bodyserif" fill="#3d3936" font-size="19">
      <text x="128" y="404">No indicators of a likelihood</text>
      <text x="128" y="430">of serious harm.</text>
    </g>
    <line x1="128" y1="458" x2="422" y2="458" stroke="#e6ddcc" stroke-width="1.5"/>
    <text x="128" y="492" class="fig" fill="#7a7268" font-size="16" font-weight="600">A decision to do</text>
    <text x="128" y="514" class="fig" fill="#7a7268" font-size="16" font-weight="600">no further safeguarding.</text>
  </g>
  <text x="275" y="600" class="fade bodyserif" style="animation-delay:1.6s" font-size="18" font-style="italic" fill="#8a8175" text-anchor="middle">The grade we avoid &#8212; and the one</text>
  <text x="275" y="624" class="fade bodyserif" style="animation-delay:1.6s" font-size="18" font-style="italic" fill="#8a8175" text-anchor="middle">that gives the others their weight.</text>

  <!-- ============ Medium card ============ -->
  <g class="rise" style="animation-delay:2.6s">
    <rect x="545" y="520" width="350" height="252" rx="14" fill="#fbf8f1" stroke="#e2c4c4" stroke-width="1.5"/>
    <rect x="545" y="520" width="350" height="11" rx="5.5" fill="#a14545"/>
    <text x="573" y="576" class="serif" fill="#a14545" font-size="32" font-weight="600">Medium</text>
    <g class="bodyserif" fill="#3d3936" font-size="19">
      <text x="573" y="622">Indicators are present &#8212; but</text>
      <text x="573" y="648">serious harm is unlikely unless</text>
      <text x="573" y="674">circumstances change.</text>
    </g>
    <line x1="573" y1="700" x2="867" y2="700" stroke="#e6ddcc" stroke-width="1.5"/>
    <text x="573" y="734" class="fig" fill="#a14545" font-size="16" font-weight="600">Act now: a referral,</text>
    <text x="573" y="756" class="fig" fill="#a14545" font-size="16" font-weight="600">a follow-up, a marker.</text>
  </g>

  <!-- ============ High card ============ -->
  <g class="rise" style="animation-delay:2.6s">
    <rect x="910" y="520" width="350" height="252" rx="14" fill="#fbf8f1" stroke="#d9a9a9" stroke-width="1.5"/>
    <rect x="910" y="520" width="350" height="11" rx="5.5" fill="#7c2828"/>
    <text x="938" y="576" class="serif" fill="#7c2828" font-size="32" font-weight="600">High</text>
    <g class="bodyserif" fill="#3d3936" font-size="19">
      <text x="938" y="622">Indicators are present &#8212; and</text>
      <text x="938" y="648">serious harm could happen</text>
      <text x="938" y="674">at any time.</text>
    </g>
    <line x1="938" y1="700" x2="1232" y2="700" stroke="#e6ddcc" stroke-width="1.5"/>
    <text x="938" y="734" class="fig" fill="#7c2828" font-size="16" font-weight="600">Immediate, active</text>
    <text x="938" y="756" class="fig" fill="#7c2828" font-size="16" font-weight="600">safeguarding.</text>
  </g>

  <text x="640" y="806" class="fade fig" style="animation-delay:3s" fill="#8a8175" font-size="17" font-style="italic" text-anchor="middle">Definitions via the OASys / SafeLives DASH lineage, carried into the College of Policing&#8217;s DARA.</text>
</svg>
