<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Quote from Lawrence Sherman: Police practices should be based on scientific evidence about what works best.">
  <rect width="1200" height="480" fill="#1a1817"/>
  <rect x="0" y="0" width="10" height="480" fill="#7c2828"/>
  <text x="78" y="240" fill="#3d3936" font-family="Fraunces, Georgia, serif" font-size="240" font-weight="700">&#8220;</text>
  <text x="150" y="158" fill="#fbf8f1" font-family="Fraunces, Georgia, serif" font-size="46" font-weight="500"><tspan x="150">Police practices should be</tspan><tspan x="150" dy="64">based on scientific evidence</tspan><tspan x="150" dy="64">about what works best.</tspan></text>
  <text x="150" y="408" fill="#a14545" font-family="'DM Sans', system-ui, sans-serif" font-size="23" font-weight="600" letter-spacing="3">LAWRENCE SHERMAN</text>
  <text x="150" y="442" fill="#9c9389" font-family="'DM Sans', system-ui, sans-serif" font-size="20">&#8220;Evidence-Based Policing&#8221;, 1998</text>
</svg>
