name: Ingest police database

# Builds the historical, queryable police database in Supabase from the
# data.police.uk bulk archive + JSON API (scripts/ingest-bulk-police.mjs).
# Runs after the lightweight snapshot job (police-data.yml). Needs Supabase
# secrets; if they're absent the job no-ops with a clear message rather than
# failing, so forks without Supabase aren't broken.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Optional repo variables: INGEST_MONTHS, INGEST_LSOA_MONTHS
on:
  schedule:
    - cron: '0 7 6 * *'
  workflow_dispatch:
    inputs:
      months:
        description: 'Comma-separated months to ingest (blank = recent window)'
        required: false
        default: ''
      phase:
        description: 'Which phase to run'
        required: false
        type: choice
        default: all
        options: [all, bulk, metadata, seed-population]

concurrency:
  group: police-database
  cancel-in-progress: false

jobs:
  # Single place to check the Supabase secrets; both ingest jobs gate on this so
  # forks without secrets no-op cleanly instead of failing.
  guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
    steps:
      - name: Guard — Supabase configured?
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Supabase secrets not set — skipping ingest."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  # Phase 1 — bulk crime CSV. Read per-month over many small range requests; each
  # month is upserted independently and idempotently, so a cut-short run persists
  # completed months and a re-run resumes.
  bulk:
    needs: guard
    if: needs.guard.outputs.ok == 'true' && contains(fromJSON('["", "all", "bulk"]'), github.event.inputs.phase || '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Node 22+ ships a global WebSocket. @supabase/supabase-js's realtime
          # client constructs eagerly inside createClient() and throws on Node 20
          # ("Node.js 20 detected without native WebSocket support"), even though
          # the ingest only uses PostgREST. 22 avoids that with no extra deps.
          node-version: '22'
      - name: Install ingest deps
        run: npm install --no-save @supabase/supabase-js unzipper
      - name: Ingest bulk crime data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_MONTHS: ${{ vars.INGEST_MONTHS }}
          INGEST_LSOA_MONTHS: ${{ vars.INGEST_LSOA_MONTHS }}
          SKIP_API: '1'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.months }}" ]; then ARGS="--months ${{ github.event.inputs.months }}"; fi
          node scripts/ingest-bulk-police.mjs $ARGS

  # Phase 2 — JSON API metadata. Decoupled from bulk so it has its own runner and
  # timeout (it can no longer starve, or be starved by, the bulk phase). Each force
  # is written and checkpointed as it completes, so a cut-short run resumes.
  metadata:
    needs: guard
    if: needs.guard.outputs.ok == 'true' && contains(fromJSON('["", "all", "metadata"]'), github.event.inputs.phase || '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ingest deps
        run: npm install --no-save @supabase/supabase-js unzipper
      - name: Ingest API metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_REFRESH_DAYS: ${{ vars.API_REFRESH_DAYS }}
          API_CONCURRENCY: ${{ vars.API_CONCURRENCY }}
          SKIP_BULK: '1'
        run: node scripts/ingest-bulk-police.mjs

  # Phase 3 (manual) — population denominators. Dispatch-only: the committed
  # CSVs under data/seeds/ are regenerated by scripts/fetch-census-ethnicity.mjs
  # (census + mid-year estimates change at most yearly), so this only needs to
  # run after those files change. Unlocks per-1,000 rates and the stop & search
  # disparity ratios.
  seed-population:
    needs: guard
    if: needs.guard.outputs.ok == 'true' && github.event.inputs.phase == 'seed-population'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install seed deps
        run: npm install --no-save @supabase/supabase-js
      - name: Seed population denominators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          POP_CSV=$(ls data/seeds/pfa-population-*.csv | sort | tail -1)
          YEAR=$(basename "$POP_CSV" .csv | sed 's/^pfa-population-//')
          node scripts/seed-population.mjs --ethnicity data/seeds/pfa-ethnicity-census2021.csv --totals "$POP_CSV" --year "$YEAR"
