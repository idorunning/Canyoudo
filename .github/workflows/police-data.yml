name: Refresh police data snapshot

# data.police.uk publishes monthly, a couple of months in arrears. We check on
# the 5th of each month (and on demand) and commit the snapshot if it changed.
# Netlify's GitHub integration redeploys the site on the resulting push.
#
# This job only refreshes raw stop & search data — no API key needed. The AI
# interpretation runs at request time in netlify/functions/interpret.mts.
on:
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:

permissions:
  contents: write

# A new run supersedes an in-flight one rather than racing it on git push.
concurrency:
  group: police-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch snapshot
        run: node scripts/fetch-police-data.mjs

      - name: Install SheetJS
        run: npm install --no-save xlsx

      - name: Fetch recorded crime
        continue-on-error: true
        run: node scripts/fetch-recorded-crime.mjs

      - name: Commit if changed
        run: |
          git config user.name "police-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain src/content/policedata src/data)" ]; then
            echo "No change in snapshot."; exit 0
          fi
          git add src/content/policedata src/data
          month=$(node -p "require('./src/content/policedata/national.json').provenance.datasetMonth")
          git commit -m "Refresh police data snapshot ($month)"
          # main may have advanced (concurrent merges) while this ran — rebase
          # onto the latest ref before pushing, and retry. Only this workflow
          # touches the data files, so the rebase is conflict-free.
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || git rebase --abort
            if git push origin "HEAD:${{ github.ref_name }}"; then echo "Pushed on attempt $attempt."; exit 0; fi
            echo "Push attempt $attempt failed; retrying."; sleep 4
          done
          echo "Could not push after retries."; exit 1
