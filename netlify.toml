[build]
  command = "bash fetch-images.sh && npm run build"
  publish = "dist"

[build.environment]
  # Node 22+ for both the build and the Functions runtime: @supabase/supabase-js's
  # createClient() eagerly builds a realtime client that needs a native WebSocket and
  # throws on Node < 22 ("Node.js 20 detected without native WebSocket support"), which
  # 502s every DB-backed /api/police-db endpoint. Same reason the ingest workflow pins 22.
  NODE_VERSION = "22"
  # Public, build-time config (these values are exposed in the page source by
  # design — they are not secrets).
  # Analytics — GoatCounter (privacy-friendly, no cookie banner).
  PUBLIC_GOATCOUNTER_URL = "https://thinkingaboutpolicing.goatcounter.com/count"
  # Newsletter — MailerLite embedded form (account ID + form ID).
  PUBLIC_MAILERLITE_ACCOUNT_ID = "2415278"
  PUBLIC_MAILERLITE_FORM_ID = "vYwUFz"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
