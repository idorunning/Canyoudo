[build]
  command = "bash fetch-images.sh && npm run build"
  publish = "dist"

[build.environment]
  # Node 22+ for the build. @supabase/supabase-js's createClient() eagerly builds a
  # realtime client that needs a native WebSocket and throws on Node < 22 ("Node.js 20
  # detected without native WebSocket support"). Same reason the ingest workflow pins 22.
  NODE_VERSION = "22"
  # NODE_VERSION alone does NOT set the Functions runtime — it stayed on Node 20 and kept
  # 502-ing every DB-backed /api/police-db endpoint. This is the dedicated knob for the
  # functions runtime. (src/lib/police-db.ts also stubs WebSocket as a belt-and-braces
  # guard, so the read path works even if the runtime is older.)
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  # Public, build-time config (these values are exposed in the page source by
  # design — they are not secrets).
  # Comments — Cusdis app ID (the comment thread won't render without it).
  PUBLIC_CUSDIS_APP_ID = "0924657c-a644-4821-abdc-6743a5de701d"
  # Analytics — GoatCounter. The count endpoint moved to a Netlify dashboard
  # env var (Site configuration → Environment variables) rather than living
  # here: once the same value is also set as a real Netlify env var, Netlify's
  # secrets scanner treats any copy of it elsewhere in the repo as a leak and
  # aborts the build, so it can only be defined in one place now.
  # Newsletter — MailerLite embedded form (account ID + form ID).
  PUBLIC_MAILERLITE_ACCOUNT_ID = "2415278"
  PUBLIC_MAILERLITE_FORM_ID = "vYwUFz"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Pages must always be revalidated: a reader who has a page open in a
    # background tab, or whose browser cached it from before the last deploy,
    # should never keep seeing it once it's out of date. Costs a round-trip
    # on every repeat visit; correctness after a fast-turnaround fix wins over
    # that. Hashed build assets get their own long-lived rule below, which
    # (being more specific) overrides this for /_astro/*.
    Cache-Control = "no-cache"

# Astro's hashed JS/CSS bundles are content-addressed — a changed file gets a
# new filename, so the old one can be cached forever without risk of staleness.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
