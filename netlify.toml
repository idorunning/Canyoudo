[build]
  command = "bash fetch-images.sh && npm run build"
  publish = "dist"

[build.environment]
  # Node 22+ for the build. @supabase/supabase-js's createClient() eagerly builds a
  # realtime client that needs a native WebSocket and throws on Node < 22 ("Node.js 20
  # detected without native WebSocket support"). Same reason the ingest workflow pins 22.
  NODE_VERSION = "22"
  # NODE_VERSION alone does NOT set the Functions runtime — it stayed on Node 20 and kept
  # 502-ing every DB-backed /api/police-db endpoint. This is the dedicated knob for the
  # functions runtime. (src/lib/police-db.ts also stubs WebSocket as a belt-and-braces
  # guard, so the read path works even if the runtime is older.)
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  # Public, build-time config (these values are exposed in the page source by
  # design — they are not secrets).
  # Comments — Cusdis app ID (the comment thread won't render without it).
  PUBLIC_CUSDIS_APP_ID = "0924657c-a644-4821-abdc-6743a5de701d"
  # Analytics — GoatCounter (privacy-friendly, no cookie banner).
  PUBLIC_GOATCOUNTER_URL = "https://thinkingaboutpolicing.goatcounter.com/count"
  # Newsletter — MailerLite embedded form (account ID + form ID).
  PUBLIC_MAILERLITE_ACCOUNT_ID = "2415278"
  PUBLIC_MAILERLITE_FORM_ID = "vYwUFz"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
